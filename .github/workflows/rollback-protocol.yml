name: Rollback Protocol Checks

on:
  workflow_dispatch:
  push:
    branches: [feat/windows-single-version-rollback]
    paths:
      - src-tauri/rollback-core/**
      - .github/workflows/rollback-protocol.yml

permissions:
  contents: read

jobs:
  protocol:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/rollback-core/target
          key: windows-rollback-protocol-${{ hashFiles('src-tauri/rollback-core/Cargo.lock') }}
      - name: Check independent protocol formatting
        run: cargo fmt --manifest-path src-tauri/rollback-core/Cargo.toml -- --check
      - name: Test single-previous-version and transaction contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'rollback-protocol-test.log'
          cargo test --locked --manifest-path src-tauri/rollback-core/Cargo.toml 2>&1 | Tee-Object -FilePath $log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $details = (Get-Content -LiteralPath $log -Tail 100) -join "`n"
            if ($details.Length -gt 12000) { $details = $details.Substring($details.Length - 12000) }
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Rollback protocol test details::$details"
            throw "Rollback protocol checks exited with $result."
          }
          $summary = (Select-String -LiteralPath $log -SimpleMatch 'test result:' | ForEach-Object { $_.Line }) -join '; '
          Write-Output "::notice title=Rollback protocol checks::$summary"
      - name: Verify actual historical production Setup signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'rollback-signature-contract'
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          $release = 'https://github.com/qwqwd65-ui/cc-switch/releases/download/v3.20.4-fork.3'
          $setup = Join-Path $root 'historical-setup.exe'
          $manifest = Join-Path $root 'latest.json'
          Invoke-WebRequest -Uri "$release/CC-Switch-v3.20.4-fork.3-Windows-Setup.exe" -OutFile $setup -TimeoutSec 120
          Invoke-WebRequest -Uri "$release/latest.json" -OutFile $manifest -TimeoutSec 60
          cargo run --locked --manifest-path src-tauri/rollback-core/Cargo.toml --example verify-historical-setup -- $setup $manifest src-tauri/tauri.conf.json
          if ($LASTEXITCODE -ne 0) { throw 'Historical Setup verification contract failed.' }
          $env:CC_SWITCH_GA_SIGNED_SETUP = $setup
          $env:CC_SWITCH_GA_SIGNED_MANIFEST = $manifest
          cargo test --locked --manifest-path src-tauri/rollback-core/Cargo.toml --lib windows_snapshot::tests::protocol_source_cache_is_verified_and_owned_by_exactly_its_previous_point -- --exact --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Protocol source package ownership contract failed.' }
          Write-Output '::notice title=Protocol source package cache::A protocol update required the real signed source Setup and bound it to points/<current-point>/package. Missing and misplaced package caches were rejected.'
