name: Windows Rollback Installer Probe

on:
  workflow_dispatch:
  push:
    branches: [feat/windows-single-version-rollback]

permissions:
  contents: read

concurrency:
  group: windows-rollback-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nsis-order:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - name: Check probe script syntax
        shell: pwsh
        run: ./scripts/check-powershell-syntax.ps1 scripts/probe-windows-installers.ps1
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-rollback-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-rollback-cargo-
      - name: Setup pnpm
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build unsigned NSIS probe
        shell: pwsh
        run: |
          pnpm tauri --version
          pnpm tauri build --bundles nsis --config src-tauri/tauri.rollback-probe.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect generated installer
        shell: pwsh
        run: |
          $script = Get-ChildItem src-tauri/target/release/nsis -Recurse -Filter installer.nsi | Select-Object -First 1
          if (-not $script) { throw 'Generated installer.nsi was not found' }
          node scripts/check-nsis-order.mjs $script.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise historical and candidate installers
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe)
          if ($setup.Count -ne 1) { throw 'Expected exactly one candidate Setup' }
          ./scripts/probe-windows-installers.ps1 -CandidateSetup $setup[0].FullName -CandidateBinary src-tauri/target/release/cc-switch.exe -EvidenceDirectory artifacts/rollback-installer-probe
      - name: Archive installer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-order
          path: |
            src-tauri/target/release/nsis/**/installer.nsi
            src-tauri/target/release/bundle/nsis/*.exe
            artifacts/rollback-installer-probe/**
          if-no-files-found: warn
