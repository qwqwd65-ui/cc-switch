name: Fork Release (Win Portable + macOS + Linux deb)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v3.11.0-fork.5 或 3.11.0-fork.5，v 前缀会自动去除)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update version in config files
        shell: bash
        run: |
          # 去掉 v 前缀
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # 更新 package.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          # 更新 Cargo.toml
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          # 更新 tauri.conf.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          # fork 发布流不产出 updater 包，避免要求 signing key
          sed -i "s/\"createUpdaterArtifacts\": true/\"createUpdaterArtifacts\": false/" src-tauri/tauri.conf.json
          echo "Updated version to $VERSION"
          grep -E '"version"|^version =|"createUpdaterArtifacts"' package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: windows-x64-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: windows-x64-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App (no bundle)
        run: pnpm tauri build --no-bundle

      - name: Prepare Portable Zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $exePath = 'src-tauri/target/release/cc-switch.exe'
          if (-not (Test-Path $exePath)) {
            Write-Error "exe not found: $exePath"
            exit 1
          }
          $portableDir = 'release-assets/CC-Switch-Portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item $exePath $portableDir
          @('# CC Switch portable build marker', 'portable=true') |
            Set-Content -Path (Join-Path $portableDir 'portable.ini') -Encoding UTF8
          $zipName = "CC-Switch-v$version-Windows-Portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath "release-assets/$zipName" -Force
          Remove-Item -Recurse -Force $portableDir
          Write-Host "Created: $zipName"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: release-assets/*

  build-macos:
    runs-on: macos-14
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update version in config files
        shell: bash
        run: |
          # 去掉 v 前缀
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # 更新 package.json
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          # 更新 Cargo.toml
          sed -i '' "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          # 更新 tauri.conf.json
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          # fork 发布流不产出 updater 包，避免要求 signing key
          sed -i '' "s/\"createUpdaterArtifacts\": true/\"createUpdaterArtifacts\": false/" src-tauri/tauri.conf.json
          echo "Updated version to $VERSION"
          grep -E '"version"|^version =|"createUpdaterArtifacts"' package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: macos-arm64-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: macos-arm64-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App (macOS Universal)
        run: pnpm tauri build --target universal-apple-darwin

      - name: Prepare macOS Zip
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | sed 's/.*: *"\([^"]*\)".*/\1/')
          APP_PATH=""
          for path in \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/release/bundle/macos"; do
            if [ -d "$path" ]; then
              APP_PATH=$(find "$path" -maxdepth 1 -name "*.app" -type d | head -1 || true)
              [ -n "$APP_PATH" ] && break
            fi
          done
          if [ -z "$APP_PATH" ]; then
            echo "No .app found" >&2
            exit 1
          fi
          APP_DIR=$(dirname "$APP_PATH")
          APP_NAME=$(basename "$APP_PATH")
          NEW_ZIP="CC-Switch-v${VERSION}-macOS.zip"
          cd "$APP_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$APP_NAME" "$NEW_ZIP"
          mv "$NEW_ZIP" "$GITHUB_WORKSPACE/release-assets/"
          echo "macOS zip ready: $NEW_ZIP"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: release-assets/*

  build-linux:
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update version in config files
        shell: bash
        run: |
          # 去掉 v 前缀
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # 更新 package.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          # 更新 Cargo.toml
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          # 更新 tauri.conf.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          # fork 发布流不产出 updater 包，避免要求 signing key
          sed -i "s/\"createUpdaterArtifacts\": true/\"createUpdaterArtifacts\": false/" src-tauri/tauri.conf.json
          echo "Updated version to $VERSION"
          grep -E '"version"|^version =|"createUpdaterArtifacts"' package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            patchelf \
            libssl-dev \
            rpm \
            flatpak \
            flatpak-builder \
            elfutils \
            xdg-utils
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: linux-x64-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: linux-x64-pnpm-store-

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri App (Linux deb)
        run: pnpm tauri build --bundles deb

      - name: Prepare Linux deb
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | sed 's/.*: *"\([^"]*\)".*/\1/')
          DEB=$(find src-tauri/target/release/bundle -name "*.deb" | head -1 || true)
          if [ -z "$DEB" ]; then
            echo "No .deb found under src-tauri/target/release/bundle" >&2
            exit 1
          fi
          NEW_DEB="CC-Switch-v${VERSION}-Linux-x86_64.deb"
          cp "$DEB" "release-assets/$NEW_DEB"
          echo "Linux deb ready: $NEW_DEB"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: release-assets/*

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Strip v prefix
        run: |
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-zip
          path: release-assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: release-assets

      - name: List Assets
        run: ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: CC Switch v${{ env.VERSION }}
          prerelease: false
          body: |
            ## 与上游的区别
            | 功能 | 官方版 | 自用增强版 |
            |------|--------|------------|
            | 供应商卡片 | 主要显示供应商名称 | 名称后直接显示当前模型名，切换时更直观 |
            | 获取模型列表 | 获取后主要用于填充模型输入 | 获取后可直接搜索模型，匹配和选择更方便 |
            | 新增供应商位置 | 默认排到列表最后 | 默认插入到第二位，便于立即调整和使用 |
            | 供应商右键菜单 | 无快捷排序操作 | 支持右键置顶 / 置底 |
            | 托盘左键单击 | 弹出菜单 | 直接切换主窗口显示 / 隐藏 |
            | 测试模型按钮 | 入口较弱或默认隐藏 | 已恢复测试模型按钮，可直接验证当前供应商连通性 |
            | 测试参数配置 | 高级测试配置入口较弱 | 保留高级测试参数配置，可调超时、重试、降级阈值和提示词 |
            | 测试提示词 | 固定单条提示词 | 内置 18 条提示词池中随机选取，并支持用户自定义 |
            | 更新检查 | 不适配当前 fork 发布方式 | 识别本仓库 Releases，提示用户手动更新 |
            ---
            ## 下载
            - **Windows**: `CC-Switch-v${{ env.VERSION }}-Windows-Portable.zip`（绿色便携版，解压即用）
            - **macOS**: `CC-Switch-v${{ env.VERSION }}-macOS.zip`（解压即用，支持 Intel 和 Apple Silicon）
            - **Linux (x86_64)**: `CC-Switch-v${{ env.VERSION }}-Linux-x86_64.deb`（Debian/Ubuntu 安装包）
            > 提示：macOS 如遇"已损坏"提示，可在终端执行：`xattr -cr "/Applications/CC Switch.app"`
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
