name: Fork Release (Signed In-App Updater)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v3.20.4-fork.2 或 3.20.4-fork.2，v 前缀会自动去除）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows NSIS + Portable
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      VERSION: ${{ inputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Update release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          grep -E '"version"|^version =|"createUpdaterArtifacts"' package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json

      - name: Verify updater signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'TAURI_SIGNING_PRIVATE_KEY is missing' >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing' >&2; exit 1; }

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: windows-x64-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: windows-x64-pnpm-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed NSIS updater
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm tauri --version
          & pnpm tauri build --bundles nsis 2>&1 | Tee-Object -FilePath tauri-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path tauri-build.log -SimpleMatch '__TAURI_BUNDLE_TYPE variable not found in binary') {
            throw 'Tauri CLI failed to patch the bundle type into the Windows binary'
          }

      - name: Prepare Windows assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version

          $installer = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Recurse -Filter '*.exe' |
            Where-Object { $_.Name -like '*setup.exe' } |
            Select-Object -First 1
          if ($null -eq $installer) {
            $installer = Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Recurse -Filter '*.exe' |
              Select-Object -First 1
          }
          if ($null -eq $installer) {
            throw 'NSIS installer was not generated'
          }
          $signature = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $signature)) {
            throw "Updater signature was not generated for $($installer.Name)"
          }

          $setupName = "CC-Switch-v$version-Windows-Setup.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination "release-assets/$setupName"
          Copy-Item -LiteralPath $signature -Destination "release-assets/$setupName.sig"

          $exePath = 'src-tauri/target/release/cc-switch.exe'
          if (-not (Test-Path -LiteralPath $exePath)) {
            throw "Portable executable not found: $exePath"
          }
          $portableDir = 'release-assets/CC-Switch-Portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item -LiteralPath $exePath -Destination $portableDir
          @('# CC Switch portable build marker', 'portable=true') |
            Set-Content -Path (Join-Path $portableDir 'portable.ini') -Encoding UTF8
          Compress-Archive -Path "$portableDir/*" -DestinationPath "release-assets/CC-Switch-v$version-Windows-Portable.zip" -Force
          Remove-Item -Recurse -Force -LiteralPath $portableDir

          Get-ChildItem release-assets | Format-Table Name, Length

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: release-assets/*
          if-no-files-found: error

  build-macos:
    name: macOS Universal + Updater
    runs-on: macos-14
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Update release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          sed -i '' "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i '' "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          grep -E '"version"|^version =|"createUpdaterArtifacts"' package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json

      - name: Verify updater signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'TAURI_SIGNING_PRIVATE_KEY is missing' >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing' >&2; exit 1; }

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/Library/pnpm/store
          key: macos-universal-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: macos-universal-pnpm-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed macOS updater
        shell: bash
        run: |
          set -euo pipefail
          pnpm tauri --version
          pnpm tauri build --target universal-apple-darwin --bundles app 2>&1 | tee tauri-build.log
          if grep -Fq '__TAURI_BUNDLE_TYPE variable not found in binary' tauri-build.log; then
            echo 'Tauri CLI failed to patch the bundle type into the macOS binary' >&2
            exit 1
          fi

      - name: Prepare macOS assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          bundle_dir='src-tauri/target/universal-apple-darwin/release/bundle/macos'
          app_path=$(find "$bundle_dir" -maxdepth 1 -name '*.app' -type d | head -1)
          updater_path=$(find "$bundle_dir" -maxdepth 1 -name '*.tar.gz' -type f | head -1)
          test -n "$app_path" || { echo 'macOS .app was not generated' >&2; exit 1; }
          test -n "$updater_path" || { echo 'macOS updater archive was not generated' >&2; exit 1; }
          test -f "$updater_path.sig" || { echo 'macOS updater signature was not generated' >&2; exit 1; }

          updater_name="CC-Switch-v${VERSION}-macOS.tar.gz"
          cp "$updater_path" "release-assets/$updater_name"
          cp "$updater_path.sig" "release-assets/$updater_name.sig"

          app_dir=$(dirname "$app_path")
          app_name=$(basename "$app_path")
          (
            cd "$app_dir"
            ditto -c -k --sequesterRsrc --keepParent "$app_name" "$GITHUB_WORKSPACE/release-assets/CC-Switch-v${VERSION}-macOS.zip"
          )
          ls -la release-assets

      - name: Upload macOS assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: release-assets/*
          if-no-files-found: error

  build-linux:
    name: Linux AppImage + deb
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Update release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json
          sed -i "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          grep -E '"version"|^version =|"createUpdaterArtifacts"' package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json

      - name: Verify updater signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'TAURI_SIGNING_PRIVATE_KEY is missing' >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing' >&2; exit 1; }

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: linux-x64-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: linux-x64-pnpm-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build signed Linux updater
        shell: bash
        run: |
          set -euo pipefail
          pnpm tauri --version
          pnpm tauri build --bundles appimage,deb 2>&1 | tee tauri-build.log
          if grep -Fq '__TAURI_BUNDLE_TYPE variable not found in binary' tauri-build.log; then
            echo 'Tauri CLI failed to patch the bundle type into the Linux binary' >&2
            exit 1
          fi

      - name: Prepare Linux assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          appimage=$(find src-tauri/target/release/bundle -name '*.AppImage' -type f | head -1)
          deb=$(find src-tauri/target/release/bundle -name '*.deb' -type f | head -1)
          test -n "$appimage" || { echo 'Linux AppImage was not generated' >&2; exit 1; }
          test -f "$appimage.sig" || { echo 'Linux AppImage signature was not generated' >&2; exit 1; }
          test -n "$deb" || { echo 'Linux deb was not generated' >&2; exit 1; }

          appimage_name="CC-Switch-v${VERSION}-Linux-x86_64.AppImage"
          cp "$appimage" "release-assets/$appimage_name"
          cp "$appimage.sig" "release-assets/$appimage_name.sig"
          cp "$deb" "release-assets/CC-Switch-v${VERSION}-Linux-x86_64.deb"
          ls -la release-assets

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: release-assets/*
          if-no-files-found: error

  create-release:
    name: Publish signed Fork Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout manifest generator
        uses: actions/checkout@v6

      - name: Normalize version
        shell: bash
        run: |
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: windows-assets
          path: release-assets

      - name: Download macOS assets
        uses: actions/download-artifact@v4
        with:
          name: macos-assets
          path: release-assets

      - name: Download Linux assets
        uses: actions/download-artifact@v4
        with:
          name: linux-assets
          path: release-assets

      - name: Generate and validate latest.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-updater-manifest.mjs \
            release-assets "$TAG" "$GITHUB_REPOSITORY" release-assets/latest.json
          node -e "const m=require('./release-assets/latest.json'); if(Object.keys(m.platforms).length !== 4) process.exit(1); console.log(m)"
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: CC Switch v${{ env.VERSION }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## Fork 应用内自动更新

            本版本启用 Tauri 签名更新器。安装版用户后续可在应用内完成检查、下载、验签、安装和重启。

            | 平台 | 推荐下载 | 应用内更新 |
            |------|----------|------------|
            | Windows x64 | `CC-Switch-v${{ env.VERSION }}-Windows-Setup.exe` | 支持 |
            | Windows Portable | `CC-Switch-v${{ env.VERSION }}-Windows-Portable.zip` | 手动替换 |
            | macOS Universal | `CC-Switch-v${{ env.VERSION }}-macOS.zip` | 支持 |
            | Linux x86_64 | `CC-Switch-v${{ env.VERSION }}-Linux-x86_64.AppImage` | 支持 |
            | Debian/Ubuntu | `CC-Switch-v${{ env.VERSION }}-Linux-x86_64.deb` | 手动安装 |

            `latest.json`、`.sig` 和 `.tar.gz` 是应用内更新所需资产，无需手动下载。
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
