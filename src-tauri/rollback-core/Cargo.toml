[package]
name = "cc-switch-rollback-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

# Shared by the GUI coordinator and the independent helper. This crate must
# never depend on Tauri or initialize/migrate the application's database.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
minisign-verify = "0.2.5"

[target.'cfg(windows)'.dependencies]
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
tempfile = "3"
